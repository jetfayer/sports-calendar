name: Update sports calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch TheSportsDB events
        env:
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
        run: python scripts/fetch_events.py

      - name: Commit updated data
        run: |
          git config user.name "sports-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update sports events"
            git push
          fi
